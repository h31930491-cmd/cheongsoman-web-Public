name: 인스타 예약 게시

# 5분마다 큐를 확인해 예약 시각이 지난 게시물만 올린다.
#  · GitHub 문서: 스케줄은 최소 5분 간격이고 "start of every hour" 에 지연이 잦다.
#    그래서 예약 시각은 정각을 피해 잡는다(prepare.mjs 기본값 21:37).
#  · 공개 저장소는 60일간 저장소 활동이 없으면 스케줄이 자동 중지된다. 게시가 커밋을 남기지만
#    한동안 게시가 없다면 Actions 탭에서 다시 켜야 할 수 있다.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '모의 실행(실제 게시 안 함)'
        type: boolean
        default: false
      threads_probe:
        description: '스레드 점검: check=토큰만 / probe=토큰+사진+컨테이너 생성(게시 안 함). 결과는 ig/threads-check.json'
        type: choice
        options: ['none', 'check', 'probe']
        default: 'none'

concurrency:
  group: ig-post
  cancel-in-progress: false # 게시 도중에 끊기면 중복 게시 위험이 있어 취소하지 않는다

permissions:
  contents: write # 게시 결과(status/mediaId)를 queue.json 에 되쓰기 위해 필요

jobs:
  post:
    # 포크된 저장소에서는 돌지 않게 막는다
    if: github.repository == 'h31930491-cmd/cheongsoman-web-Public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 올릴 게시물이 있는지 먼저 확인
        id: check
        run: |
          if [ ! -f ig/queue.json ]; then
            echo "due=0" >> "$GITHUB_OUTPUT"; echo "큐 파일 없음"; exit 0
          fi
          # 인스타(status) 또는 스레드(threads.status) 어느 한쪽이라도 올릴 게 있으면 진행한다.
          DUE=$(node -e "
            const q=require('./ig/queue.json');
            const now=Date.now();
            const due=(i)=>Date.parse(i.scheduledAt)<=now;
            const ig=(q.items||[]).filter(i=>i.status==='pending'&&due(i)).length;
            const th=(q.items||[]).filter(i=>i.threads&&i.threads.enabled&&i.threads.status==='pending'&&due(i)).length;
            console.log(ig+th);
          ")
          PROBE="${{ inputs.threads_probe }}"
          if [ "$DUE" = "0" ] && [ -n "$PROBE" ] && [ "$PROBE" != "none" ]; then DUE=probe; fi
          echo "due=$DUE" >> "$GITHUB_OUTPUT"
          echo "지금 올릴 게시물(인스타+스레드): $DUE 건"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.due != '0'
        with:
          node-version: '20'

      - name: 게시
        if: steps.check.outputs.due != '0' && steps.check.outputs.due != 'probe'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node .github/scripts/ig-post.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      # 스레드 — 인스타 단계가 실패해도 진행한다(always). 같은 queue.json 의 threads 필드만 바꾼다.
      - name: 스레드 게시
        if: always() && steps.check.outputs.due != '0' && steps.check.outputs.due != 'probe'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node .github/scripts/th-post.mjs ${{ inputs.dry_run && '--dry-run' || '' }}

      # 수동 점검(workflow_dispatch threads_probe=check|probe) — 게시하지 않고 토큰·사진·컨테이너만 확인해 ig/threads-check.json 에 기록
      - name: 스레드 점검
        if: steps.check.outputs.due == 'probe'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: node .github/scripts/th-post.mjs ${{ inputs.threads_probe == 'probe' && '--probe' || '--check' }}

      # 인스타·스레드 결과(+점검 결과)를 한 번의 커밋·push 로 기록한다(두 번 push 하면 충돌).
      - name: 결과를 queue.json 에 기록
        if: always() && steps.check.outputs.due != '0' && !inputs.dry_run
        run: |
          if [ -z "$(git status --porcelain ig/queue.json ig/threads-check.json)" ]; then
            echo "queue.json / threads-check.json 변경 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ig/queue.json ig/threads-check.json
          git commit -m "인스타·스레드: 게시 결과 기록 [skip ci]"
          git push
